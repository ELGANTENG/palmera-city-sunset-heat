<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera City: Sunset Heat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; font-family: 'Trebuchet MS', Verdana, sans-serif; }
  #wrap { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Palmera City Sunset Heat: an open-world crime game. Walk with WASD, drive with WASD, press E to enter a car, F to punch, P to pause."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
